<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Resguardo 3D | Control de Bodega</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236366f1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z'></path><polyline points='3.27 6.96 12 12.01 20.73 6.96'></polyline><line x1='12' y1='22.08' x2='12' y2='12'></line></svg>" />
    <!-- Fonts: Inter for that clean SaaS/Time Tracker look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Icons: Using Material Symbols for generic clean icons -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-box">
                    <span class="material-symbols-rounded">category</span>
                </div>
                <div class="brand-text">
                    <h1>Catálogo<span class="dim">Resguardo3D</span></h1>
                    <span class="subtitle">Bodega Central</span>
                </div>
            </div>

            <nav class="nav-menu">
                <div class="nav-group">
                    <label>Menu</label>
                    <button class="nav-item active" data-view="inventory">
                        <span class="material-symbols-rounded">inventory_2</span>
                        Inventario
                    </button>
                    <!-- Future: Checkouts/Entregas separate view -->
                </div>

                <div class="nav-group">
                    <label>Admin</label>
                    <button class="nav-item" data-view="new-item">
                        <span class="material-symbols-rounded">add_circle</span>
                        Nueva Pieza
                    </button>
                    <button class="nav-item" onclick="alert('Configuración de Firebase pendiente')">
                        <span class="material-symbols-rounded">settings</span>
                        Configuración
                    </button>
                </div>
            </nav>

            <div class="user-footer">
                <div class="avatar">AB</div>
                <div class="user-info">
                    <span class="name">Admin Bodega</span>
                    <span class="status">● Conectado</span>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <div class="breadcrumbs">
                    <span id="page-title">Inventario</span>
                    <span id="page-subtitle" class="hidden"> / Detalle</span>
                </div>
                <div class="top-actions">
                    <div class="search-wrapper">
                        <span class="material-symbols-rounded icon">search</span>
                        <input type="text" id="global-search" placeholder="Buscar por ID, nombre o bodega..."
                            autocomplete="off">
                    </div>
                </div>
            </header>

            <div id="content-area" class="viewport">
                <!-- Vistes inyectadas aquí -->
            </div>
        </main>
    </div>

    <!-- Firebase Import Map (Cloud connection) -->
    <script type="importmap">
    {
        "imports": {
            "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js",
            "firebase/storage": "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js"
        }
    }
    </script>

    <!-- App Modules -->
    <script type="module" src="js/db.js"></script>
    <script type="module" src="js/app.js"></script>
</body>

</html>
