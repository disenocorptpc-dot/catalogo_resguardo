<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Resguardo 3D | Control de Bodega SOLULOGIS</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236366f1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z'></path><polyline points='3.27 6.96 12 12.01 20.73 6.96'></polyline><line x1='12' y1='22.08' x2='12' y2='12'></line></svg>" />
    <!-- Fonts: Inter + JetBrains Mono for tabular IDs and dimensions -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Icons: Material Symbols Rounded -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header" onclick="navigate('inventory')" style="cursor: pointer;">
                <div class="logo-box">
                    <span class="material-symbols-rounded">deployed_code</span>
                </div>
                <div class="brand-text">
                    <h1>Catálogo<span class="dim">Resguardo3D</span></h1>
                    <span class="subtitle">SOLULOGIS &bull; The Palace Co.</span>
                </div>
            </div>

            <nav class="nav-menu">
                <div class="nav-group">
                    <label>Operación</label>
                    <button class="nav-item active" data-view="inventory">
                        <span class="material-symbols-rounded">inventory_2</span>
                        Inventario General
                        <span id="nav-total-badge" class="nav-count-badge">0</span>
                    </button>
                    <button class="nav-item" id="nav-grid-btn" onclick="window.setInventoryLayout('grid')">
                        <span class="material-symbols-rounded">grid_view</span>
                        Catálogo Visual
                    </button>
                    <button class="nav-item" data-view="labels" id="nav-labels-btn">
                        <span class="material-symbols-rounded">badge</span>
                        Gestor de Etiquetas
                    </button>
                </div>

                <div class="nav-group">
                    <label>Temporadas</label>
                    <div id="sidebar-categories" class="sidebar-cat-list">
                        <!-- Injected dynamically -->
                    </div>
                </div>

                <div class="nav-group">
                    <label>Administración</label>
                    <button class="nav-item" data-view="new-item">
                        <span class="material-symbols-rounded">add_circle</span>
                        Nueva Pieza
                    </button>
                    <button class="nav-item" onclick="window.exportInventoryCSV()">
                        <span class="material-symbols-rounded">download</span>
                        Exportar CSV
                    </button>
                    <button class="nav-item" id="admin-lock-btn" onclick="window.toggleAdminSession()">
                        <span class="material-symbols-rounded" id="admin-lock-icon">lock</span>
                        <span id="admin-lock-label">Desbloquear Edición</span>
                    </button>
                </div>
            </nav>

            <div class="user-footer">
                <div class="avatar">3D</div>
                <div class="user-info">
                    <span class="name">Coord. Impresión 3D</span>
                    <span class="status" id="db-status-indicator">● Conectado a D1</span>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <div class="breadcrumbs">
                    <button id="back-nav-btn" class="back-btn hidden" onclick="navigate('inventory')" title="Volver al inventario">
                        <span class="material-symbols-rounded">arrow_back</span>
                    </button>
                    <span id="page-title" onclick="navigate('inventory')" style="cursor: pointer;">Inventario General</span>
                    <span id="page-subtitle" class="hidden"> / Detalle</span>
                </div>
                <div class="top-actions">
                    <div class="view-switcher" id="header-view-switcher">
                        <button type="button" class="view-btn active" id="btn-view-table" onclick="window.setInventoryLayout('table')" title="Vista de tabla operativa">
                            <span class="material-symbols-rounded">table_rows</span>
                            <span>Tabla</span>
                        </button>
                        <button type="button" class="view-btn" id="btn-view-grid" onclick="window.setInventoryLayout('grid')" title="Vista de catálogo visual">
                            <span class="material-symbols-rounded">grid_view</span>
                            <span>Tarjetas</span>
                        </button>
                    </div>
                    <div class="search-wrapper">
                        <span class="material-symbols-rounded icon">search</span>
                        <input type="text" id="global-search" placeholder="Buscar por ID, nombre, temporada o medidas... (/)"
                            autocomplete="off">
                        <button type="button" id="clear-search-btn" class="clear-search hidden" onclick="window.clearSearch()" title="Limpiar búsqueda">
                            <span class="material-symbols-rounded">close</span>
                        </button>
                    </div>
                </div>
            </header>

            <div id="content-area" class="viewport">
                <!-- Vistas inyectadas aquí -->
            </div>
        </main>
    </div>

    <!-- Lightbox Modal -->
    <div id="lightbox-modal" class="lightbox-overlay hidden" onclick="window.closeLightbox(event)">
        <div class="lightbox-card" onclick="event.stopPropagation()">
            <div class="lightbox-header">
                <div>
                    <div id="lightbox-title" class="lightbox-title">Pieza</div>
                    <div id="lightbox-subtitle" class="lightbox-subtitle">ID</div>
                </div>
                <button type="button" class="lightbox-close" onclick="window.closeLightbox()">
                    <span class="material-symbols-rounded">close</span>
                </button>
            </div>
            <div class="lightbox-body">
                <img id="lightbox-img" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="Vista ampliada">
            </div>
        </div>
    </div>

    <!-- Third Party Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- App Modules -->
    <script type="module" src="js/db.js"></script>
    <script type="module" src="js/app.js"></script>

    <!-- Print Container (Hidden) -->
    <div id="print-ficha"></div>
</body>

</html>
